plugins { id 'com.android.application' }

android {
    namespace 'id.sulselbar.presensipkl'
    compileSdk 34

    defaultConfig {
        applicationId 'id.sulselbar.presensipkl'
        minSdk 23
        targetSdk 34
        versionCode 20
        versionName '2.0'
    }
    signingConfigs {
        // Kunci tetap (release.jks ada di repo) supaya tiap build punya tanda tangan sama dan bisa menimpa (update) aplikasi yang terpasang.
        rilis {
            storeFile file('release.jks')
            storePassword 'presensipkl'
            keyAlias 'presensipkl'
            keyPassword 'presensipkl'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.rilis
        }
    }
        // Nama berkas hasil build: Presensi-PKL.apk (bukan app-release.apk)
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = "Presensi-PKL.apk" }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
