name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tes:
    name: Lint dan tes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Pasang dependensi
        run: pip install -r requirements-dev.txt

      - name: Lint Python (ruff)
        run: ruff check .

      - name: Tes
        run: pytest -q

  image:
    name: Build dan uji image Docker
    needs: tes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: absensi-uji:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image harus benar-benar hidup dengan pengaturan seketat produksi: pengguna biasa dan filesystem read-only.
      - name: Uji image (web dan api harus sehat)
        run: |
          docker run -d --name uji-web -p 8501:8501 --read-only --tmpfs /tmp -e HOME=/tmp -e API_KEY=kunci-ci absensi-uji:ci
          docker run -d --name uji-api -p 8000:8000 --read-only --tmpfs /tmp -e HOME=/tmp -e API_KEY=kunci-ci \
            absensi-uji:ci uvicorn api:api --host=0.0.0.0 --port=8000
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health > /dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "web dan api sehat (percobaan $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Image tidak sehat setelah 90 detik"
          docker logs uji-web | tail -40
          docker logs uji-api | tail -40
          exit 1
