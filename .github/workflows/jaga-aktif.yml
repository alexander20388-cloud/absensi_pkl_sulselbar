name: Jaga aplikasi tetap hidup
on:
  schedule:
    - cron: "17 */6 * * *"      # tiap 6 jam (waktu UTC); GitHub kadang terlambat beberapa menit
  workflow_dispatch:
jobs:
  buka-aplikasi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python .github/scripts/jaga_aktif.py
        env:
          APP_URL: https://absensipklsulselbar.streamlit.app/
