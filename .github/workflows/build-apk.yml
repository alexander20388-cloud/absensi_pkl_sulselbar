name: Bangun APK
on:
  workflow_dispatch:
  push:
    paths: ["android/**"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle -p android assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PresensiPKL-apk
          path: android/app/build/outputs/apk/release/Presensi-PKL.apk
